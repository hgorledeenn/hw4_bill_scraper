name: Daily NJ Senate Bill Scrape

on:
  schedule:
    # 11:00 UTC daily (~6-7am US Eastern depending on DST)
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      attempt:
        description: 'Retry attempt number (internal use, for timeout re-runs)'
        required: false
        default: '1'

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bounded below the job's own timeout-minutes so there's always time left
      # to commit progress and (if needed) re-dispatch. The notebook itself
      # checkpoints data/nj_senate_bills.json + the changelog every 500 bills,
      # so if this gets killed mid-run, nothing before the last checkpoint is lost.
      - name: Run scraper notebook (checkpoints every 500 bills)
        id: run_notebook
        run: |
          set +e
          timeout 335m jupyter nbconvert --to notebook --execute --inplace NJ_Senate_Bill_Scraper.ipynb
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit and push progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "NJ Senate bill scrape: $(date -u +%F) (attempt ${{ github.event.inputs.attempt || '1' }})"
            git push
          fi

      # exit code 124 means the `timeout` wrapper killed the scrape before it
      # finished. Re-dispatch this workflow so a fresh run picks up where the
      # checkpoint left off -- already-saved bills hash-match against the
      # changelog logic and get skipped, so the retry only scrapes what's left.
      - name: Re-trigger if the scrape timed out
        if: always() && steps.run_notebook.outputs.exit_code == '124'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          attempt="${{ github.event.inputs.attempt || '1' }}"
          if [ "$attempt" -ge 5 ]; then
            echo "Already retried $attempt times today -- not re-triggering again."
            exit 0
          fi
          next=$((attempt + 1))
          echo "Scrape hit the time limit -- re-dispatching workflow (attempt $next)."
          gh workflow run scrape.yml -f attempt="$next"
